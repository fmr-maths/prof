/* Plan : agence de détectives de nuit. Mur bleu-vert profond, papier kraft, ficelle rouge, lampe ambrée.
   Une colonne, gros boutons (iPad, projection, téléphone). Un seul accent animé : l'enseigne néon. */
:root {
  --wall: #14252e;
  --wall-2: #1d3642;
  --paper: #f3ead3;
  --kraft: #c9a26b;
  --wood: #5e4129;
  --red: #c8402f;
  --lamp: #f2b84b;
  --ink: #26201a;
  --ok: #3f9d66;
  --ko: #d4493d;
  --font-display: "Special Elite", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--wall);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.45;
  min-height: 100%;
  overflow-x: hidden;
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 44px);
}
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 400; margin: 0; }
button { font: inherit; }
a { color: inherit; }
.app { max-width: 980px; margin: 0 auto; padding: 12px 16px 48px; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* ---------- accueil ---------- */
.skyline { position: relative; border-radius: 16px; overflow: hidden; border: 4px solid var(--wood); height: 150px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.skyline svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.neon {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 92%;
  font-family: var(--font-display); color: #ffe3a3; letter-spacing: .08em; text-transform: uppercase;
  font-size: clamp(1.5rem, 6.5vw, 2.8rem); line-height: 1.1;
  text-shadow: 0 0 6px #ffcf6a, 0 0 18px #f08b2d, 0 0 34px #e0601c;
  animation: flick 7s infinite;
}
.neon small { display: block; font-size: .38em; letter-spacing: .3em; margin-top: 4px; color: #ffd9a0; }
@keyframes flick { 0%, 92%, 96%, 100% { opacity: 1; } 93% { opacity: .55; } 95% { opacity: .85; } }

.board {
  position: relative; margin-top: 16px; padding: 18px; border: 10px solid var(--wood); border-radius: 10px;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.14) 0 2px, transparent 3px) 0 0/22px 22px,
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.1) 0 2px, transparent 3px) 0 0/26px 26px,
    #b98b57;
  box-shadow: inset 0 0 24px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.45);
}
.strings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cards { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 14px; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 150px; padding: 18px 10px 12px; background: var(--paper); color: var(--ink); text-decoration: none;
  border-radius: 4px; box-shadow: 0 6px 12px rgba(0,0,0,.4); transform: rotate(var(--r, 0deg)); transition: transform .15s, box-shadow .15s;
}

<body>
<main class="app"><div id="view"></div></main>
<canvas id="fx"></canvas>
<script>
// ====================== LOGIQUE : générateurs d'exercices (sans DOM) ======================
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sum = a => a.reduce((x, y) => x + y, 0);
const asc = a => [...a].sort((x, y) => x - y);
const median = a => { const s = asc(a), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
const fmt = n => String(Math.round(n * 100) / 100).replace(".", ",").replace("-", "−");
const neg = n => n < 0 ? `(${fmt(n)})` : fmt(n);
const parse = s => {
  if (typeof s !== "string") return NaN;
  const t = s.replace(/\s/g, "").replace("%", "").replace(",", ".").replace("−", "-");
  return t === "" ? NaN : Number(t);
};
const round1 = x => Math.round(x * 10 + 1e-9) / 10;
const clean1 = x => { const f = x * 10 - Math.floor(x * 10 + 1e-9); return Math.abs(f - 0.5) > 0.06; };
const distinct = (n, min, max) => { const s = new Set(); while (s.size < n) s.add(rnd(min, max)); return shuffle([...s]); };
const ord = k => `${k}<sup>e</sup>`;
const joinSemi = a => a.map(fmt).join(" ; ");

// n parts >= minU dont la somme vaut U
function parts(U, k, minU) {
  for (;;) {
    const cuts = new Set();
    while (cuts.size < k - 1) cuts.add(rnd(1, U - 1));
    const c = [0, ...[...cuts].sort((a, b) => a - b), U];
    const p = c.slice(1).map((x, i) => x - c[i]);
    if (p.every(x => x >= minU)) return p;
  }
}

const COLORS = [
  { n: "rouge", c: "#d4493d" }, { n: "bleu", c: "#3b78c9" }, { n: "vert", c: "#3f9d66" },
  { n: "jaune", c: "#e8b730" }, { n: "noir", c: "#2c2c33" }, { n: "orange", c: "#e8812f" }
];
const sw = c => `<span class="sw" style="background:${c}"></span>`;

// ---- constructeurs de zones de réponse ----
const W = {
  num: (id, label, answer, unit = "") => ({ id, kind: "num", label, answer, unit }),
  choice: (id, label, options, answerIdx) => ({ id, kind: "choice", label, options, answerIdx }),
  slider: (id, label, answer, unit) => ({ id, kind: "slider", label, answer, unit, min: 0, max: 100, step: 1 }),
  order: (id, label, items, answer) => ({ id, kind: "order", label, items, answer }),
  pick: (id, label, items, answer) => ({ id, kind: "pick", label, items, answer }),
  tf: (id, label, statements) => ({ id, kind: "tf", label, statements }),
  frac: (id, label, n, d) => ({ id, kind: "frac", label, n, d })
};
function answered(w, v) {
  switch (w.kind) {
    case "num": return !isNaN(parse(v));
    case "frac": return !!v && !isNaN(parse(v.n)) && !isNaN(parse(v.d));
    case "choice": case "pick": return v !== undefined && v !== null;
    case "slider": return typeof v === "number";
    case "order": return Array.isArray(v) && v.length === w.items.length && v.every(x => x !== null);
    case "tf": return Array.isArray(v) && v.length === w.statements.length && v.every(x => x === true || x === false);
  }
  return false;
}
function evalW(w, v) {
  switch (w.kind) {
    case "num": return Math.abs(parse(v) - w.answer) < 1e-6;
    case "frac": { const n = parse(v.n), d = parse(v.d); return Number.isInteger(n) && Number.isInteger(d) && d > 0 && n * w.d === w.n * d; }
    case "choice": return v === w.answerIdx;
    case "pick": return w.items[v] === w.answer;
    case "slider": return v === w.answer;
    case "order": return v.map((k, i) => w.items[k] === w.answer[i]);
    case "tf": return v.map((x, i) => x === w.statements[i].a);
  }
  return false;
}
const allOk = m => Array.isArray(m) ? m.every(Boolean) : m === true;

// ---- tableaux et séries ----
const chips = (a, unit = "") => `<div class="chips">${a.map(v => `<span class="chip">${fmt(v)}${unit}</span>`).join("")}</div>`;
const tableCats = cats => `<div class="tblwrap"><table class="tbl"><tr><th>Couleur du manteau</th>${cats.map(c => `<td>${sw(c.c)} ${c.n}</td>`).join("")}</tr><tr><th>Effectif</th>${cats.map(c => `<td>${c.e}</td>`).join("")}</tr></table></div>`;
const tableVE = (label, vals, effs) => `<div class="tblwrap"><table class="tbl"><tr><th>${label}</th>${vals.map(v => `<td>${v}</td>`).join("")}</tr><tr><th>Effectif</th>${effs.map(e => `<td>${e}</td>`).join("")}</tr></table></div>`;
const prodExpr = (vals, effs) => vals.map((v, i) => `${v} × ${effs[i]}`).join(" + ");

function freqCats(T, k, step) {
  const p = parts(T / step, k, 1).map(x => x * step);
  return shuffle(COLORS).slice(0, k).map((c, i) => ({ ...c, e: p[i] }));
}
const FREQ_HINT1 = "Rappel : fréquence = effectif ÷ effectif total. Pour l'obtenir en pourcentage, on l'écrit avec un dénominateur égal à 100.";

// ======================= Dossier 1 : fréquence (fraction, pourcentage, écriture décimale) =======================
const FREQ_CTX = "Les témoins ont décrit le manteau du voleur.";
function g1a() {
  const T = pick([20, 25, 40, 50]), step = T === 40 ? 2 : 1;
  const cats = freqCats(T, 4, step), q = pick(cats);
  return {
    ctx: FREQ_CTX,
    consigne: `Quelle est la fréquence, sous forme de fraction, des témoins qui ont vu un manteau ${q.n} ?`,
    calc: false,
    data: tableCats(cats) + `<p class="note">Effectif total : <b>${T}</b></p>`,
    widgets: [W.frac("f", "Fréquence (fraction)", q.e, T)],
    hints: ["Rappel : fréquence = effectif ÷ effectif total. Sous forme de fraction, on écrit l'effectif au numérateur et l'effectif total au dénominateur.",
      `Le numérateur est l'effectif des manteaux ${q.n} : lis-le dans le tableau. Le dénominateur est l'effectif total.`,
      `Numérateur : ${q.e}. Dénominateur : ${T}.`],
    solution: `fréquence = effectif ÷ effectif total = <b>${q.e}/${T}</b>.<br>(Une fraction égale, comme la fraction simplifiée, est aussi acceptée.)`
  };
}
function g1b() {
  const T = pick([20, 25, 50]), k = 100 / T;
  const cats = freqCats(T, 3, 1), q = pick(cats), ans = q.e * 100 / T;
  return {
    ctx: FREQ_CTX,
    consigne: `Calcule l'effectif total, puis la fréquence, en pourcentage, des témoins qui ont vu un manteau ${q.n}.`,
    calc: false,
    data: tableCats(cats),
    widgets: [W.num("T", "Effectif total", T), W.slider("f", "Place le curseur sur la fréquence.", ans, "%")],
    hints: ["Rappel : fréquence = effectif ÷ effectif total. Pour l'obtenir en pourcentage, on l'écrit avec un dénominateur égal à 100. Commence par l'effectif total.",
      `Effectif total : ${cats.map(c => c.e).join(" + ")}. La fréquence des manteaux ${q.n} est ${q.e}/(effectif total).`,
      `${T} × ${fmt(k)} = 100. Fais la même multiplication par ${fmt(k)} sur ${q.e}.`],
    solution: `Effectif total : ${cats.map(c => c.e).join(" + ")} = <b>${T}</b>.<br>fréquence = ${q.e}/${T}. ${T} × ${fmt(k)} = 100, donc ${q.e} × ${fmt(k)} = ${ans}.<br>La fréquence est de <b>${ans} %</b>.`
  };
}
function g1c() {
  const [T, step] = pick([[60, 3], [80, 4]]);
  const p = parts(20, 4, 1).map(x => x * step);
  const cats = shuffle(COLORS).slice(0, 4).map((c, i) => ({ ...c, e: p[i] }));
  const q = pick(cats), dec = q.e / T, pct = q.e * 100 / T;
  return {
    ctx: FREQ_CTX,
    consigne: `Donne la fréquence des témoins qui ont vu un manteau ${q.n} sous trois formes : fraction, pourcentage et écriture décimale.`,
    calc: true,
    data: tableCats(cats),
    widgets: [W.frac("fr", "Fraction", q.e, T), W.num("pc", "Pourcentage", pct, "%"), W.num("dc", "Écriture décimale", dec)],
    hints: ["Rappel : fréquence = effectif ÷ effectif total. Commence par calculer l'effectif total, il n'est pas écrit.",
      `Effectif total : ${cats.map(c => c.e).join(" + ")}. La fréquence des manteaux ${q.n} est ${q.e}/(effectif total).`,
      `Fraction : effectif ÷ effectif total sous forme de fraction. Écriture décimale : ${q.e} ÷ effectif total. Pourcentage : écriture décimale × 100.`],
    solution: `Effectif total : ${cats.map(c => c.e).join(" + ")} = ${T}.<br>Fraction : <b>${q.e}/${T}</b>.<br>Écriture décimale : ${q.e} ÷ ${T} = <b>${fmt(dec)}</b>.<br>Pourcentage : ${fmt(dec)} × 100 = <b>${fmt(pct)} %</b>.`
  };
}

// ======================= Dossier 2 : médiane =======================
function g2(n, order, evenInt) {
  let vals, s;
  for (;;) {
    vals = distinct(n, 1, 40); s = asc(vals);
    if (n % 2 === 0 && evenInt && (s[n / 2 - 1] + s[n / 2]) % 2) continue;
    break;
  }
  const med = median(vals), odd = n % 2 === 1;
  const a = s[n / 2 - 1], b = s[n / 2];
  const widgets = [];
  if (order) widgets.push(W.order("o", "Range les valeurs dans l'ordre croissant : fais glisser les pastilles.", vals, s));
  widgets.push(W.num("m", "La médiane est", med));
  return {
    ctx: "Numéros trouvés sur des tickets froissés.",
    consigne: "Détermine la médiane de cette série.",
    calc: false,
    data: chips(vals),
    widgets,
    hints: [
      "Pour trouver la médiane, on range d'abord les valeurs dans l'ordre croissant.",
      odd ? `Il y a ${n} valeurs (effectif impair) : la médiane est la valeur du milieu, la ${ord((n + 1) / 2)} valeur de la série rangée.`
          : `Il y a ${n} valeurs (effectif pair) : on fait la moyenne des deux valeurs du milieu, la ${ord(n / 2)} et la ${ord(n / 2 + 1)}.`,

function skylineSVG() {

  const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

    b += `<rect x="${x}" y="${190 - h}" width="${w}" height="${h}" fill="#0b1620"/>`;

      for (let wx = x + 6; wx < x + w - 8; wx += 12)

// ---------------- actions ----------------
const clearMarks = st => { st.marks = {}; st.line = ""; st.warn = false; document.querySelectorAll(".w.ok,.w.ko,.oslot.ok,.oslot.ko,.tfrow.ok,.tfrow.ko").forEach(e => e.classList.remove("ok", "ko")); };

function check() {
  const ex = cur(), st = ex.st;
  if (st.status !== "open") return;
  if (!ex.widgets.every(w => answered(w, st.vals[w.id]))) {
    st.line = "Complète toutes les réponses avant de vérifier."; st.warn = true; render(); return;
  }
  st.tries++; st.warn = false;
  ex.widgets.forEach(w => { st.marks[w.id] = evalW(w, st.vals[w.id]); });
  const ok = ex.widgets.every(w => allOk(st.marks[w.id]));
  if (ok) {
    st.status = "ok"; st.stars = Math.max(1, 3 - (st.tries - 1) - (st.hints > 0 ? 1 : 0));
    st.msg = CHEERS[rnd(0, CHEERS.length - 1)]; st.line = ""; confetti(); finishIfLast();
  } else if (st.tries >= 3) {
    st.status = "failed"; st.stars = 0; st.line = "";
    st.msg = "Trois essais : c'est fini pour celui-ci. Lis la correction détaillée, puis passe au suivant."; finishIfLast();
  } else {
    st.msg = st.tries === 1 ? "Pas tout à fait. Regarde ce qui est en rouge et réessaie !" : "Encore un essai. Un indice peut t'aider.";
    st.line = `Essai ${st.tries} sur 3.`;
  }
  render();
}
function finishIfLast() {
  const r = R[curA];
  if (r.i === r.ex.length - 1) {
    const total = sum(r.ex.map(e => e.st.stars));
    prog[curA] = { done: true, stars: total }; saveProg();
  }
}
function hint() {
  const st = cur().st;
  if (st.status !== "open" || st.hints >= 3) return;
  st.msg = cur().hints[st.hints]; st.hints++; render();
}
function next() {
  const r = R[curA];
  if (r.i < r.ex.length - 1) r.i++; else r.fin = true;
  render(); window.scrollTo(0, 0);
}
function replay() { R[curA] = { i: 0, ex: newExercises(curA), fin: false }; render(); window.scrollTo(0, 0); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-choice],[data-pick],[data-tf],[data-step],.oslots,.pool");
  if (!t || !curA) return;
  const ex = cur(); if (!ex && !t.dataset.act) return;
  if (t.dataset.act) { ({ check, hint, next, replay })[t.dataset.act](); return; }
  const st = ex.st; if (st.status !== "open") return;
  if (t.dataset.choice) { st.vals[t.dataset.choice] = +t.dataset.i; clearMarks(st); render(); }
  else if (t.dataset.pick) { st.vals[t.dataset.pick] = +t.dataset.i; clearMarks(st); render(); }
  else if (t.dataset.tf) {
    const w = t.dataset.tf, arr = st.vals[w] || (st.vals[w] = Array(ex.widgets.find(x => x.id === w).statements.length).fill(null));
    arr[+t.dataset.s] = t.dataset.v === "1"; clearMarks(st); render();
  } else if (t.dataset.step) {
    const w = t.dataset.w, cfg = ex.widgets.find(x => x.id === w);
    const v = Math.min(cfg.max, Math.max(cfg.min, (st.vals[w] === undefined ? 50 : st.vals[w]) + (+t.dataset.step) * cfg.step));

  }
});
document.addEventListener("input", e => {
  const el = e.target; if (!curA || !el.dataset || !el.dataset.w || !cur()) return;
  const st = cur().st; if (st.status !== "open") return;

  } else if (el.dataset.p) {

document.addEventListener("keydown", e => {

  if ((e.key === "Enter" || e.key === " ") && e.target.classList) {
    if (e.target.classList.contains("tok")) { e.preventDefault(); tapTok(e.target.dataset.w, +e.target.dataset.k); }
    else if (e.target.classList.contains("oslot") && cur().st.sel) { e.preventDefault(); place(e.target.dataset.w, cur().st.sel.k, +e.target.dataset.s); }
  }

// ---------------- glisser-déposer des pastilles ----------------
function place(wid, k, s) {
  const st = cur().st; if (st.status !== "open") return;
  const o = st.vals[wid], from = o.indexOf(k), occ = o[s];
  if (from === s) return;
  if (from >= 0) o[from] = occ;
  o[s] = k; st.sel = null; clearMarks(st); render();
}
function toPool(wid, k) {
  const st = cur().st, o = st.vals[wid], from = o.indexOf(k);
  if (from >= 0) o[from] = null;
  st.sel = null; clearMarks(st); render();
}
function tapTok(wid, k) {
  const st = cur().st; if (st.status !== "open") return;
  const o = st.vals[wid], at = o.indexOf(k);
  if (st.sel && st.sel.w === wid && st.sel.k !== k && at >= 0) { place(wid, st.sel.k, at); return; }
  st.sel = st.sel && st.sel.k === k && st.sel.w === wid ? null : { w: wid, k }; render();
}
document.addEventListener("click", e => {
  if (!curA || !cur()) return;
  const slot = e.target.closest(".oslot");
  if (slot && !e.target.closest(".tok") && cur().st.sel) place(slot.dataset.w, cur().st.sel.k, +slot.dataset.s);
  const pool = e.target.closest(".pool");
  if (pool && !e.target.closest(".tok") && cur().st.sel) toPool(pool.dataset.pool, cur().st.sel.k);
});
let drag = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".tok");
  if (!el || !curA || !cur() || cur().st.status !== "open" || e.button > 0) return;
  const r = el.getBoundingClientRect();
  drag = { w: el.dataset.w, k: +el.dataset.k, el, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, wd: r.width, moved: false, ghost: null };
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 7) {
    drag.moved = true;
    const g = drag.el.cloneNode(true); g.classList.remove("sel"); g.classList.add("ghost"); g.style.width = g.style.height = drag.wd + "px";
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("lifting");
  }
  if (drag.moved) {
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.ox) + "px"; drag.ghost.style.top = (e.clientY - drag.oy) + "px";
    document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".oslot");
    if (s && s.dataset.w === drag.w) s.classList.add("hover");
  }
}, { passive: false });
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
  if (d.ghost) d.ghost.remove();
  if (d.moved) {
    if (cancelled) { render(); return; }
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".oslot");
    if (s && s.dataset.w === d.w) place(d.w, d.k, +s.dataset.s); else toPool(d.w, d.k);
  } else if (!cancelled) { tapTok(d.w, d.k); }
}
window.addEventListener("pointerup", e => endDrag(e, false));
window.addEventListener("pointercancel", e => endDrag(e, true));

// ---------------- confettis ----------------
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#f2b84b", "#3f9d66", "#f3ead3", "#c8402f", "#6aa6d6"];
  const ps = Array.from({ length: 90 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0]
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s / 1.6); ctx.restore(); });
    if (++t < 150) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

route();
