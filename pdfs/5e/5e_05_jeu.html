/* Thème : « L'Usine à Briques » — briques à tenons génériques, robots-briques inventés.
   Une colonne, gros boutons (iPad, projection, téléphone), contrastes forts, aucune information portée par la seule couleur. */
:root {
  --bg1: #14304a; --bg2: #0d2237;
  --paper: #fffaf0; --sand: #f0dcae; --ink: #1a2330;
  --red: #e63946; --yellow: #ffc233; --blue: #2a6fdb; --green: #2fa05a; --orange: #ff8a2b;
  --ok: #2f9e62; --ko: #d6453a;
  --font-display: "Fredoka", "Trebuchet MS", Verdana, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: #0d2237; min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%) fixed;
  color: var(--paper); font-family: var(--font-body); font-size: 18px; line-height: 1.45; min-height: 100%; overflow-x: hidden;
}
h1, h2, h3, h4, .display { font-family: var(--font-display); font-weight: 600; margin: 0; }
button { font: inherit; }
a { color: inherit; }
.app { max-width: 980px; margin: 0 auto; padding: 12px 16px 48px; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
small { font-size: .85em; }

/* ---------- accueil ---------- */
.factory { position: relative; border-radius: 18px; overflow: hidden; border: 4px solid var(--paper); height: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.factory svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.plaque {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; width: 88%;
  background: var(--paper); color: var(--ink); border: 4px solid var(--red); border-radius: 16px; padding: 8px 12px 6px;
  font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 7vw, 2.7rem); line-height: 1.1; box-shadow: 0 6px 0 rgba(0,0,0,.25);
}
.plaque small { display: block; font-family: var(--font-body); font-weight: 700; font-size: .4em; letter-spacing: .1em; text-transform: uppercase; color: #8c1f29; margin-top: 3px; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px 14px; margin-top: 26px; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 170px; padding: 24px 10px 12px;
  background: var(--paper); color: var(--ink); text-decoration: none; border-radius: 16px; border-top: 14px solid var(--red); box-shadow: 0 6px 0 rgba(0,0,0,.28); transition: transform .15s;
}
.card:nth-child(2) { border-top-color: var(--blue); }
.card:nth-child(3) { border-top-color: var(--green); }
.card:nth-child(4) { border-top-color: var(--orange); }
.card:nth-child(5) { border-top-color: var(--yellow); }
.card:last-child { grid-column: 1 / -1; }
.card:hover, .card:focus-visible { transform: translateY(-4px); }
.card:active { transform: scale(.98); }
.card .num {
  position: absolute; top: -24px; left: 50%; margin-left: -21px; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--paper);

<script>
// ====================== LOGIQUE : expressions, générateurs d'exercices, vérification (sans DOM) ======================
"use strict";
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sum = a => a.reduce((x, y) => x + y, 0);
const pickN = (a, n) => shuffle(a).slice(0, n);
const NBSP = " ";
// nombre -> texte français (virgule décimale, espace insécable pour les milliers, vrai signe moins)
const fmt = n => {
  const neg = n < 0, s = String(Math.round(Math.abs(n) * 100) / 100).replace(".", ","), [i, d] = s.split(",");
  return (neg ? "−" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP) + (d !== undefined ? "," + d : "");
};
const divisors = n => { const o = []; for (let d = 1; d <= n; d++) if (n % d === 0) o.push(d); return o; };

// ---- lecture des réponses de l'élève ----
const clean = s => String(s).replace(/[\s  ]/g, "");
const parseNum = s => {
  if (typeof s !== "string") return NaN;
  const t = clean(s).replace(",", ".").replace(/[−–]/g, "-");
  return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
};
// petit évaluateur sûr (pas d'eval) : + − × ÷ et parenthèses, pour les numérateurs/dénominateurs saisis sous forme de calcul
function parseExpr(s) {
  if (typeof s !== "string") return NaN;
  const src = clean(s).replace(/,/g, ".").replace(/[−–]/g, "-").replace(/[xX*·]/g, "×").replace(/[:]/g, "÷");
  if (src === "") return NaN;
  const toks = src.match(/\d+(\.\d+)?|[+\-×÷()]/g);
  if (!toks || toks.join("") !== src) return NaN;
  let p = 0;
  const peek = () => toks[p];
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") { const o = toks[p++]; const r = term(); v = o === "+" ? v + r : v - r; } return v; }
  function term() { let v = fact(); while (peek() === "×" || peek() === "÷") { const o = toks[p++]; const r = fact(); v = o === "×" ? v * r : v / r; } return v; }
  function fact() {
    const t = toks[p++];
    if (t === undefined) return NaN;
    if (t === "(") { const v = expr(); if (toks[p++] !== ")") return NaN; return v; }
    if (t === "-") return -fact();
    return /^\d/.test(t) ? Number(t) : NaN;
  }
  const v = expr();
  return p === toks.length ? v : NaN;
}

// ---- arbres d'expressions ----
const N = v => ({ k: "n", v });
const tn = x => typeof x === "number" ? N(x) : x;
const OP = (o, l, r) => ({ k: "op", o, l: tn(l), r: tn(r) });
const ADD = (l, r) => OP("+", l, r), SUB = (l, r) => OP("−", l, r), MUL = (l, r) => OP("×", l, r), DIV = (l, r) => OP("÷", l, r);
const POW = (b, e) => ({ k: "pow", b: tn(b), e });
const PAR = c => ({ k: "par", c: tn(c) });
const FR = (n, d) => ({ k: "frac", n: tn(n), d: tn(d) });
const SUP = { 2: "²", 3: "³" };
const OPNAME = { "+": "addition", "−": "soustraction", "×": "multiplication", "÷": "division" };

function ev(n) {
  switch (n.k) {
    case "n": return n.v;
    case "par": return ev(n.c);
    case "pow": return Math.pow(ev(n.b), n.e);
    case "frac": return ev(n.n) / ev(n.d);
    case "op": { const a = ev(n.l), b = ev(n.r); return n.o === "+" ? a + b : n.o === "−" ? a - b : n.o === "×" ? a * b : a / b; }
  }
}
// contrôle : tous les résultats intermédiaires sont des entiers positifs raisonnables
function chk(n, lim = 1000) {
  let v;

// ---------------- page d'exercice ----------------
const redacState = (w, st) => st.vals[w.id] || (st.vals[w.id] = { lines: [], text: "", fails: 0, curFails: 0, msg: "", good: true, done: false, m: w.model.init() });
const mk = v => v === true ? "ok" : v === false ? "ko" : Array.isArray(v) ? (v.every(Boolean) ? "ok" : "ko") : "";
function wHTML(w, st, lock) {
  const m = st.marks[w.id], v = st.vals[w.id], dis = lock ? "disabled" : "";
  switch (w.kind) {
    case "num":
      return `<div class="w ${mk(m)}"><label for="in_${w.id}">${w.label}</label><div class="field"><input id="in_${w.id}" data-w="${w.id}" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(v)}" ${dis}>${w.unit ? `<span class="unit">${w.unit}</span>` : ""}</div></div>`;
    case "frac": {
      const x = v || {};
      const inp = part => `<input class="fi" data-w="${w.id}" data-part="${part}" type="text" inputmode="${w.expr ? "text" : "decimal"}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${part === "n" ? "numérateur" : "dénominateur"}" value="${esc(x[part])}" ${dis}>`;
      return `<div class="w ${mk(m)}"><p class="wl">${w.label}</p><div class="fracin">${inp("n")}<span class="fbar" aria-hidden="true"></span>${inp("d")}</div></div>`;
    }
    case "choice":
      return `<div class="w ${mk(m)}"><p class="wl">${w.label}</p><div class="opts">${w.options.map((o, i) => `<button type="button" class="opt ${v === i ? "on" : ""}" data-choice="${w.id}" data-i="${i}" aria-pressed="${v === i}" ${dis}>${o.t}</button>`).join("")}</div></div>`;
    case "touch":
      return `<div class="w ${mk(m)}"><p class="wl">${w.label}</p>${w.render(v)}</div>`;
    case "redac": {
      const r = redacState(w, st);
      const lines = r.lines.map(t => `<div class="rline ok"><span class="req">=</span><span class="rtxt">${esc(t)}</span><span class="rmark"><span class="sr">ligne juste</span>✓</span></div>`).join("");
      const input = r.done || lock ? "" : `<div class="rline cur${r.msg && !r.good ? " ko" : ""}"><span class="req">=</span><input class="rin" id="rin_${w.id}" data-r="${w.id}" type="text" inputmode="${sys ? "text" : "none"}" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Écris ta prochaine ligne de calcul" placeholder="écris ta ligne ici" value="${esc(r.text)}"></div>`;
      const msg = r.done ? `<p class="rmsg good" role="status">✓ Calcul terminé, bien rédigé !</p>` : r.msg ? `<p class="rmsg ${r.good ? "good" : "bad"}" role="status">${r.good ? "✓ " : "✗ Ligne à corriger : "}${esc(r.msg)}</p>` : "";
      return `<div class="w redac ${r.done ? "ok" : lock ? "ko" : ""}"><p class="wl">${w.label}</p>${w.start ? `<div class="rstart">${w.start}</div>` : ""}<div class="rlines">${lines}${input}</div>${msg}${r.done || lock ? "" : `<p class="note">${w.note}</p>`}</div>`;
    }
    case "tf":
      return `<div class="w"><p class="wl">${w.label}</p>${w.statements.map((s, j) => {
        const t = v ? v[j] : undefined, mm = Array.isArray(m) ? m[j] : null;
        return `<div class="tfrow ${mm === true ? "ok" : mm === false ? "ko" : ""}"><p>${s.t}</p><div class="tfbtns"><button type="button" class="opt ${t === true ? "on" : ""}" data-tf="${w.id}" data-s="${j}" data-v="1" aria-pressed="${t === true}" ${dis}>Vrai</button><button type="button" class="opt ${t === false ? "on" : ""}" data-tf="${w.id}" data-s="${j}" data-v="0" aria-pressed="${t === false}" ${dis}>Faux</button></div></div>`;
      }).join("")}</div>`;
    case "order": {
      const o = v || (st.vals[w.id] = Array(w.items.length).fill(null));
      const used = new Set(o.filter(k => k !== null));
      const tok = k => `<div class="tok ${st.sel && st.sel.w === w.id && st.sel.k === k ? "sel" : ""}" data-w="${w.id}" data-k="${k}" role="button" tabindex="0" aria-label="étiquette : ${esc(w.items[k])}">${w.items[k]}</div>`;
      const pool = w.items.map((_, k) => k).filter(k => !used.has(k)).map(tok).join("");
      const slot = (k, i) => `<div class="oslot ${Array.isArray(m) ? (m[i] ? "ok" : "ko") : ""}" data-w="${w.id}" data-s="${i}" tabindex="0" aria-label="emplacement ${i + 1}">${k === null ? "<i>Dépose le produit ici</i>" : tok(k)}</div>`;
      return `<div class="w ${mk(m)}"><p class="wl">${w.label}</p><div class="pool" data-pool="${w.id}">${pool || '<span class="note">Toutes les étiquettes sont placées.</span>'}</div>
        <div class="orows ${st.sel ? "ready" : ""}">${o.map((k, i) => `<div class="orow"><div class="olab">${w.labels[i]}</div>${slot(k, i)}</div>`).join("")}</div></div>`;
    }
  }
  return "";
}
const CHEERS = ["Bravo, chef de chantier !", "Solide comme du béton !", "Bien emboîté !", "Quelle belle construction !", "Brique après brique, tu avances !"];

function viewActivity(a) {
  const d = ACT[a], r = ensure(a);
  if (r.fin) return viewFinal(a);
  const ex = r.ex[r.i], st = ex.st, lock = st.status !== "open";
  const mood = st.status === "ok" ? "h" : st.fails > 0 && st.status === "open" ? "w" : "n";
  const onlyRedac = ex.widgets.every(w => w.kind === "redac");
  const redOpen = !lock && ex.widgets.some(w => w.kind === "redac" && !redacState(w, st).done);
  const KL = { "=": "égal", "×": "fois", "÷": "divisé par", "−": "moins", "+": "plus", "²": "au carré", "³": "au cube", "(": "parenthèse ouvrante", ")": "parenthèse fermante", "⌫": "effacer", ",": "virgule" };
  const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", ",", "(", ")", "⌫", "×", "÷", "+", "−", "²", "³", "="];

      <div class="kprow"><button type="button" class="btn kpsys" data-act="sys">${sys ? "Clavier de calcul" : "Clavier de l'appareil"}</button><button type="button" class="btn primary kpok" data-act="check">Valider ma ligne</button></div></div>` : "";

  const last = r.i === r.ex.length - 1;
  const multi = ex.blocks.length > 1;
  const blocks = ex.blocks.map((b, bi) => `<div class="blk">${multi ? `<h3 class="btitle"><span class="bn">${bi + 1}</span>${b.title}</h3>` : ""}${b.intro || ""}<div class="answers">${b.widgets.map(w => wHTML(w, st, lock)).join("")}</div></div>`).join("");
  view.innerHTML = `
    <header class="bar">
      <a class="back" href="#accueil" aria-label="Retour à l'accueil">${HOME_ICON}</a>
      <div class="ttl"><div class="n">Activité ${a}</div><h1>${d.title}</h1></div>
      <div class="calc ${ex.calc ? "yes" : "no"}" title="${ex.calc ? "Calculatrice autorisée" : "Sans calculatrice"}">${CALC(!ex.calc)}<span>${ex.calc ? "Calculatrice autorisée" : "Sans calculatrice"}</span></div>
    </header>
    <div class="dots" aria-label="Exercice ${r.i + 1} sur 3">${dots}<span class="t">Exercice ${r.i + 1} / 3</span></div>
    ${r.i === 0 ? `<section class="storywrap">${bot(d.who, "n")}<div class="story"><h2>${d.who} a besoin de toi</h2><p>${d.story}</p></div></section>` : ""}
    <section class="card2">
      <p class="ctx">${ex.ctx}</p>
      <p class="cons">${ex.consigne}</p>
      ${blocks}
      ${keypad}
      <p class="status ${st.warn ? "warn" : ""}" aria-live="polite">${st.line || ""}</p>
      ${st.status === "failed" ? `<div class="solution"><h3>Correction détaillée</h3>${ex.solution}</div>` : ""}
      ${st.status === "ok" ? `<p class="status good">${"★".repeat(st.stars)}${"☆".repeat(3 - st.stars)} ${st.fails === 0 ? "Réussi sans aucune erreur" : `Réussi avec ${st.fails} erreur${st.fails > 1 ? "s" : ""} corrigée${st.fails > 1 ? "s" : ""}`}${st.hints ? `, avec ${st.hints} indice${st.hints > 1 ? "s" : ""}` : ""}.</p>` : ""}
      <div class="coach">${bot(d.who, mood)}<div class="bubble" aria-live="polite">${st.msg || defMsg}</div></div>
      <div class="controls">
        <button type="button" class="btn" data-act="hint" ${lock || st.hints >= 3 ? "disabled" : ""}>Indice (${st.hints}/3)</button>
        ${lock ? `<button type="button" class="btn primary" data-act="next">${last ? "Terminer l'activité" : "Exercice suivant →"}</button>`
               : redOpen ? "" : `<button type="button" class="btn primary" data-act="check">${onlyRedac ? "Valider ma ligne" : "Vérifier"}</button>`}

function viewFinal(a) {

// ---------------- actions ----------------
const clearMarks = st => { st.marks = {}; st.line = ""; st.warn = false; document.querySelectorAll(".w.ok,.w.ko,.oslot.ok,.oslot.ko,.tfrow.ok,.tfrow.ko").forEach(e => e.classList.remove("ok", "ko")); };
function check() {
  const ex = cur(), st = ex.st;
  if (st.status !== "open") return;
  const reds = ex.widgets.filter(w => w.kind === "redac"), others = ex.widgets.filter(w => w.kind !== "redac");
  let acted = false, fail3 = false, anyErr = false;
  // 1. chaque ligne écrite par l'élève est vérifiée tout de suite
  reds.forEach(w => {
    const r = redacState(w, st);
    if (r.done || !String(r.text || "").trim()) return;
    acted = true;
    const res = w.model.lines(r.m, r.text);
    r.lines.push(...res.accepted);
    if (res.accepted.length) r.curFails = 0;
    if (res.err) { r.fails++; r.curFails++; st.fails++; r.msg = res.err; r.good = false; r.text = res.rest; anyErr = true; if (r.curFails >= 3) fail3 = true; }
    else { r.curFails = 0; r.good = true; r.text = ""; r.msg = res.done ? "" : res.accepted.length > 1 ? "Ces lignes sont justes, continue !" : "Ligne juste, continue !"; if (res.done) r.done = true; }
  });
  // 2. les autres réponses (vrai/faux, fraction, choix…), comptées une seule fois tant qu'elles ne changent pas
  let othersOk = true, incomplete = false;
  if (others.length) {
    const sig = JSON.stringify(others.map(w => st.vals[w.id]));
    if (!others.every(w => answered(w, st.vals[w.id]))) { incomplete = true; othersOk = false; }
    else if (st.sig === sig) othersOk = others.every(w => allOk(st.marks[w.id]));
    else {
      st.sig = sig; others.forEach(w => { st.marks[w.id] = evalW(w, st.vals[w.id]); });
      othersOk = others.every(w => allOk(st.marks[w.id]));
      if (!othersOk) { st.tries++; st.fails++; anyErr = true; if (st.tries >= 3) fail3 = true; }
    }
  }
  if (!acted && !others.length) { st.line = "Écris ta ligne de calcul avant de valider."; st.warn = true; render(); focusR(); return; }
  const redDone = reds.every(w => redacState(w, st).done);
  st.warn = false; st.line = "";
  if (fail3) {
    st.status = "failed"; st.stars = 0;
    st.msg = "Trois erreurs sur la même question : c'est fini pour celui-ci. Lis la correction détaillée, puis passe au suivant."; finishIfLast();
  } else if (redDone && othersOk && !incomplete) {
    const base = st.fails === 0 ? 3 : st.fails <= 2 ? 2 : 1;
    st.status = "ok"; st.stars = Math.max(1, base - (st.hints > 0 ? 1 : 0));
    st.msg = CHEERS[rnd(0, CHEERS.length - 1)]; confetti(); finishIfLast();
  } else if (incomplete) {
    st.line = "Réponds aussi aux questions (vrai ou faux, fraction…) avant de vérifier."; st.warn = true; st.msg = "Il reste des questions sans réponse.";
  } else if (anyErr) {
    st.msg = "Regarde le message sous la ligne rouge, corrige-la, puis revalide. Un indice peut t'aider.";
  } else {
    st.msg = "Bien ! Écris la ligne suivante.";
  }
  render(); focusR();
}
// garde le champ de saisie ET le message de correction visibles au-dessus du clavier à l'écran
function ensureVisible() {
  const el = document.querySelector(".rin"); if (!el) return;
  const kp = document.querySelector(".kpwrap"), msg = el.closest(".redac") && el.closest(".redac").querySelector(".rmsg");
  const r = el.getBoundingClientRect(), bot = (msg || el).getBoundingClientRect().bottom, lim = innerHeight - (kp ? kp.getBoundingClientRect().height : 0) - 14;
  if (r.top > innerHeight - 40) return;
  if (bot > lim) window.scrollBy({ top: Math.min(bot - lim + 8, Math.max(0, r.top - 70)), behavior: "auto" });
  else if (r.top < 60) window.scrollBy({ top: r.top - 80, behavior: "auto" });
}
function focusR() {
  const el = document.querySelector(".rin"); if (!el) return;
  try { el.focus({ preventScroll: true }); const l = el.value.length; el.setSelectionRange(l, l); } catch (e) { /* sans importance */ }
  ensureVisible();
}
function finishIfLast() {
  const r = R[curA];
  if (r.i === r.ex.length - 1) prog[curA] = { stars: sum(r.ex.map(e => e.st.stars)) };
}
function hint() {
  const st = cur().st;
  if (st.status !== "open" || st.hints >= 3) return;
  st.msg = cur().hints[st.hints]; st.hints++; render();
}
function next() { const r = R[curA]; if (r.i < r.ex.length - 1) r.i++; else r.fin = true; render(); window.scrollTo(0, 0); ensureVisible(); }
function keyPress(k) {
  const el = (lastR && document.getElementById(lastR)) || document.querySelector(".rin");
  if (!el || el.disabled) return;
  const a = el.selectionStart == null ? el.value.length : el.selectionStart, b = el.selectionEnd == null ? a : el.selectionEnd;
  let v = el.value, p;
  if (k === "⌫") { if (a !== b) { v = v.slice(0, a) + v.slice(b); p = a; } else if (a > 0) { v = v.slice(0, a - 1) + v.slice(a); p = a - 1; } else p = 0; }
  else { v = v.slice(0, a) + k + v.slice(b); p = a + k.length; }
  el.value = v; try { el.focus({ preventScroll: true }); el.setSelectionRange(p, p); } catch (e) { /* sans importance */ }
  el.dispatchEvent(new Event("input", { bubbles: true }));
}
function replay() { R[curA] = { i: 0, ex: newExercises(curA), fin: false }; render(); window.scrollTo(0, 0); ensureVisible(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-choice],[data-tf],[data-touch],[data-key]");
  if (!t || !curA) return;
  const ex = cur(); if (!ex) return;
  if (t.dataset.key) { keyPress(t.dataset.key); return; }
  if (t.dataset.act === "sys") { sys = !sys; render(); focusR(); return; }
  if (t.dataset.act) { ({ check, hint, next, replay })[t.dataset.act](); return; }
  const st = ex.st; if (st.status !== "open") return;
  if (t.dataset.choice) { st.vals[t.dataset.choice] = +t.dataset.i; clearMarks(st); render(); }
  else if (t.dataset.touch) { st.vals[t.dataset.touch] = +t.dataset.i; clearMarks(st); render(); }
  else if (t.dataset.tf) {
    const w = t.dataset.tf, arr = st.vals[w] || (st.vals[w] = Array(ex.widgets.find(x => x.id === w).statements.length).fill(null));
    arr[+t.dataset.s] = t.dataset.v === "1"; clearMarks(st); render();
  }
});
document.addEventListener("input", e => {
  const el = e.target; if (!curA || !el.dataset || !(el.dataset.w || el.dataset.r) || !cur()) return;
  const st = cur().st; if (st.status !== "open") return;
  if (el.dataset.r) { const w = cur().widgets.find(x => x.id === el.dataset.r); if (w) redacState(w, st).text = el.value; return; }
  if (el.dataset.part) { const o = st.vals[el.dataset.w] || (st.vals[el.dataset.w] = {}); o[el.dataset.part] = el.value; }
  else st.vals[el.dataset.w] = el.value;
  clearMarks(st);
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("rin")) lastR = e.target.id; });
["pointerdown", "mousedown"].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest(".key")) e.preventDefault(); }));
document.addEventListener("keydown", e => {
  if (!curA || !cur()) return;
  if (e.key === "Enter" && e.target.matches && e.target.matches("input[type=text]")) { e.preventDefault(); check(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList) {
    if (e.target.classList.contains("tok")) { e.preventDefault(); tapTok(e.target.dataset.w, +e.target.dataset.k); }
    else if (e.target.classList.contains("oslot") && cur().st.sel) { e.preventDefault(); place(e.target.dataset.w, cur().st.sel.k, +e.target.dataset.s); }
  }
});

// ---------------- glisser-déposer des étiquettes (pointer events) + alternative « toucher puis toucher » ----------------
function place(wid, k, s) {
  const st = cur().st; if (st.status !== "open") return;
  const o = st.vals[wid], from = o.indexOf(k), occ = o[s];
  if (from === s) return;
  if (from >= 0) o[from] = occ;
  o[s] = k; st.sel = null; clearMarks(st); render();
}
function toPool(wid, k) {
  const st = cur().st, o = st.vals[wid], from = o.indexOf(k);
  if (from >= 0) o[from] = null;
  st.sel = null; clearMarks(st); render();
}
function tapTok(wid, k) {
  const st = cur().st; if (st.status !== "open") return;
  const o = st.vals[wid], at = o.indexOf(k);
  if (st.sel && st.sel.w === wid && st.sel.k !== k && at >= 0) { place(wid, st.sel.k, at); return; }
  st.sel = st.sel && st.sel.k === k && st.sel.w === wid ? null : { w: wid, k }; render();
}
document.addEventListener("click", e => {
  if (!curA || !cur()) return;
  const slot = e.target.closest(".oslot");
  if (slot && !e.target.closest(".tok") && cur().st.sel) place(slot.dataset.w, cur().st.sel.k, +slot.dataset.s);
  const pool = e.target.closest(".pool");
  if (pool && !e.target.closest(".tok") && cur().st.sel) toPool(pool.dataset.pool, cur().st.sel.k);
});
let drag = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".tok");
  if (!el || !curA || !cur() || cur().st.status !== "open" || e.button > 0) return;
  const r = el.getBoundingClientRect();
  drag = { w: el.dataset.w, k: +el.dataset.k, el, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, wd: r.width, ht: r.height, moved: false, ghost: null };
});
function moveGhost() {
  if (!drag || !drag.ghost) return;
  drag.ghost.style.left = (drag.px - drag.ox) + "px"; drag.ghost.style.top = (drag.py - drag.oy) + "px";
  document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
  const s = document.elementFromPoint(drag.px, drag.py)?.closest(".oslot");
  if (s && s.dataset.w === drag.w) s.classList.add("hover");
}
// défilement automatique quand le doigt approche du haut ou du bas de l'écran
function autoScroll() {
  if (!drag || drag.raf) return;
  const step = () => {
    if (!drag || !drag.moved) return;
    const edge = 90, h = innerHeight;
    const over = document.elementFromPoint(drag.px, drag.py)?.closest(".oslot");
    const dy = over ? 0 :  drag.py > h - edge ? Math.ceil((drag.py - (h - edge)) / 5) : drag.py < edge ? -Math.ceil((edge - drag.py) / 5) : 0;
    if (dy) { scrollBy(0, dy); moveGhost(); }
    drag.raf = requestAnimationFrame(step);
  };
  drag.raf = requestAnimationFrame(step);
}
window.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 7) {
    drag.moved = true;
    const g = drag.el.cloneNode(true); g.classList.remove("sel"); g.classList.add("ghost"); g.style.width = drag.wd + "px"; g.style.minHeight = drag.ht + "px";
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("lifting");
  }
  if (drag.moved) { e.preventDefault(); drag.px = e.clientX; drag.py = e.clientY; moveGhost(); autoScroll(); }
}, { passive: false });
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null; if (d.raf) cancelAnimationFrame(d.raf);
  document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
  if (d.ghost) d.ghost.remove();
  if (d.moved) {
    if (cancelled) { render(); return; }
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".oslot");
    if (s && s.dataset.w === d.w) place(d.w, d.k, +s.dataset.s); else toPool(d.w, d.k);
  } else if (!cancelled) { tapTok(d.w, d.k); }
}
window.addEventListener("pointerup", e => endDrag(e, false));
window.addEventListener("pointercancel", e => endDrag(e, true));

// ---------------- confettis en briques (aucun son) ----------------
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#e63946", "#ffc233", "#2a6fdb", "#2fa05a", "#fffaf0", "#ff8a2b"];
  const ps = Array.from({ length: 80 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4,
    s: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0]
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s, -p.s / 2, p.s * 2, p.s);
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.fillRect(-p.s * .6, -p.s * .75, p.s * .45, p.s * .28); ctx.fillRect(p.s * .15, -p.s * .75, p.s * .45, p.s * .28);
      ctx.restore();
    });
    if (++t < 150) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

route();
