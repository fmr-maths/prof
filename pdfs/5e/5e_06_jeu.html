/* Thème : « Les Patrouilleurs du Carrefour » — port de plaisance, véhicules-robots inventés.
   Une colonne, gros boutons (iPad, projection, téléphone), contrastes forts, aucune information portée par la seule couleur. */
:root {
  --sea: #0d3b55;
  --sea-2: #145a7c;
  --paper: #fff8e6;
  --sand: #f3e2b3;
  --ink: #16222b;
  --orange: #ff7a2f;
  --red: #e8503a;
  --yellow: #ffd23f;
  --blue: #1f6fb2;
  --ok: #2f9e62;
  --ko: #d6453a;
  --font-display: "Fredoka", "Trebuchet MS", Verdana, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: linear-gradient(180deg, #0d3b55 0%, #0a2d42 100%) fixed;
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.45;
  min-height: 100%;
  overflow-x: hidden;
}
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 600; margin: 0; }
button { font: inherit; }
a { color: inherit; }
.app { max-width: 980px; margin: 0 auto; padding: 12px 16px 48px; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
sup { font-size: .7em; line-height: 0; }

/* ---------- accueil ---------- */
.harbor { position: relative; border-radius: 18px; overflow: hidden; border: 4px solid #fff8e6; height: 170px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.harbor svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.plaque {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; width: 88%;
  background: var(--paper); color: var(--ink); border: 4px solid var(--orange); border-radius: 16px; padding: 8px 12px 6px;
  font-family: var(--font-display); font-weight: 600; font-size: clamp(1.3rem, 5.6vw, 2.5rem); line-height: 1.1;
  box-shadow: 0 6px 0 rgba(0,0,0,.25);
}
.plaque small { display: block; font-family: var(--font-body); font-weight: 700; font-size: .42em; letter-spacing: .12em; text-transform: uppercase; color: #8a3a12; margin-top: 3px; }

.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 14px; margin-top: 20px; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 160px; padding: 22px 10px 12px; background: var(--paper); color: var(--ink); text-decoration: none;
  border-radius: 16px; border-top: 14px solid var(--orange); box-shadow: 0 6px 0 rgba(0,0,0,.28); transition: transform .15s;
}
.card:nth-child(2n) { border-top-color: var(--blue); }
.card:nth-child(3n) { border-top-color: #2e8b57; }
.card:hover, .card:focus-visible { transform: translateY(-4px); }
.card:active { transform: scale(.98); }
.card .num {
  position: absolute; top: -22px; left: 50%; margin-left: -20px; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--paper);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; border: 3px solid var(--paper);
}

<body>
<main class="app"><div id="view"></div></main>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
// ====================== LOGIQUE : figures et générateurs d'exercices (sans DOM) ======================
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = n => String(Math.round(n * 100) / 100).replace(".", ",").replace("-", "−");
const deg = n => fmt(n) + "°";
const parse = s => {
  if (typeof s !== "string") return NaN;
  const t = s.replace(/\s/g, "").replace("°", "").replace(",", ".").replace("−", "-");
  return t === "" ? NaN : Number(t);
};
const ord = k => `${k}<sup>e</sup>`;

// ---- géométrie ----
const RAD = Math.PI / 180;
const norm360 = a => ((a % 360) + 360) % 360;
const P = (c, ang, d) => [c[0] + d * Math.cos(ang * RAD), c[1] - d * Math.sin(ang * RAD)];
const dirOf = (from, to) => norm360(Math.atan2(-(to[1] - from[1]), to[0] - from[0]) / RAD);
const angleBetween = (v, a, b) => { const d = Math.abs(dirOf(v, a) - dirOf(v, b)); return d > 180 ? 360 - d : d; };
const r2 = x => Math.round(x * 100) / 100;
const fx = x => r2(x).toString();

// Styles de marquage : la couleur ne porte jamais seule l'information (nombre d'arcs différent).
const STY = {
  a: { c: "#e4572e", n: 1 },
  b: { c: "#1f6fb2", n: 2 },
  c: { c: "#2e8b57", n: 3 }
};

// Figure : sécantes. theta = direction de la 1re droite, alpha = angle du secteur 0.
function secantSpec(theta, alpha) {
  const O = [160, 125], L = 115;
  const A0 = [0, alpha, 180, 180 + alpha], A1 = [alpha, 180, 180 + alpha, 360];
  return {
    kind: "sec", O, theta, alpha, vb: [320, 250], hitR: 100,
    lines: [[P(O, theta, L), P(O, theta + 180, L)], [P(O, theta + alpha, L), P(O, theta + alpha + 180, L)]],
    segs: [], dots: [O], marks: [],
    mark(i, o = {}) {
      const m = { v: O, a: P(O, theta + A0[i], 60), b: P(O, theta + A1[i], 60), deg: i % 2 ? 180 - alpha : alpha, id: i, ...o };
      this.marks.push(m); return m;
    }
  };
}
// Figure : deux droites coupées par une sécante (droites non parallèles, comme dans le cours).
function twoSpec(beta, phi1, phi2, mir) {
  const C = [160, 125], D = 90, M = p => mir ? [320 - p[0], p[1]] : p;
  const F = P(C, beta, D / 2), K = P(C, beta + 180, D / 2);
  const def = {
    F0: [F, phi1, beta], F1: [F, beta, phi1 + 180], F2: [F, phi1 + 180, beta + 180], F3: [F, beta + 180, phi1 + 360],
    K0: [K, phi2, beta], K1: [K, beta, phi2 + 180], K2: [K, phi2 + 180, beta + 180], K3: [K, beta + 180, phi2 + 360]
  };
  const lines = [[P(C, beta, D / 2 + 70), P(C, beta + 180, D / 2 + 70)], [P(F, phi1, 100), P(F, phi1 + 180, 100)], [P(K, phi2, 100), P(K, phi2 + 180, 100)]]
    .map(l => l.map(M));
  return {
    kind: "two", vb: [320, 250], hitR: 46, lines, segs: [], dots: [M(F), M(K)], marks: [], def, beta, phi1, phi2, M, F: M(F), K: M(K),
    mark(id, o = {}) {
      const [v, a0, a1] = def[id];
      const m = { v: M(v), a: M(P(v, a0, 50)), b: M(P(v, a1, 50)), deg: a1 - a0, id, ...o };
      this.marks.push(m); return m;
    }
  };
}
// Figure : triangle (angles en A, B, C), ajusté dans le cadre.
function triSpec(angs, mir) {
  const [A, B, C] = angs;
  const s = x => Math.sin(x * RAD);
  const BC = 200, AB = BC * s(C) / s(A);
  let pts = [[0, 0], [0, 0], [0, 0]];
  const pB = [0, 0], pC = [BC, 0], pA = [AB * Math.cos(B * RAD), -AB * Math.sin(B * RAD)];
  pts = [pA, pB, pC];
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  const k = Math.min(240 / w, 160 / h), ox = 160 - k * (Math.min(...xs) + Math.max(...xs)) / 2, oy = 125 - k * (Math.min(...ys) + Math.max(...ys)) / 2;
  pts = pts.map(p => { const q = [ox + k * p[0], oy + k * p[1]]; return mir ? [320 - q[0], q[1]] : q; });
  const spec = {
    kind: "tri", vb: [320, 250], pts, angs, lines: [], segs: [[pts[0], pts[1]], [pts[1], pts[2]], [pts[2], pts[0]]], dots: [], marks: [],
    mark(i, o = {}) {
      const v = pts[i], a = pts[(i + 1) % 3], b = pts[(i + 2) % 3];
      const m = { v, a, b, deg: angs[i], id: i, lr: 46, r: 26, ...o };
      this.marks.push(m); return m;
    }
  };
  return spec;
}
// Figure : sécantes + triangle (O sommet commun ; P sur la 1re droite, Q sur la 2e). Angle en O dans le triangle = secteur 0.
function secTriSpec(theta, alpha, aP) {
  const bQ = 180 - alpha - aP, s = x => Math.sin(x * RAD);
  let op = 88, oq = op * s(aP) / s(bQ);
  const mx = Math.max(op, oq); op = op * 88 / mx; oq = oq * 88 / mx;
  const sp = secantSpec(theta, alpha);
  const Pp = P(sp.O, theta, op), Qq = P(sp.O, theta + alpha, oq);
  sp.kind = "sectri"; sp.segs = [[Pp, Qq]]; sp.dots = [sp.O, Pp, Qq]; sp.Pp = Pp; sp.Qq = Qq; sp.aP = aP; sp.bQ = bQ;
  sp.markP = function (o = {}) { const m = { v: Pp, a: sp.O, b: Qq, deg: aP, id: "P", lr: 44, r: 24, ...o }; this.marks.push(m); return m; };
  sp.markQ = function (o = {}) { const m = { v: Qq, a: sp.O, b: Pp, deg: bQ, id: "Q", lr: 44, r: 24, ...o }; this.marks.push(m); return m; };
  return sp;
}

// ---- rendu SVG (chaîne de caractères) ----
const posWords = ang => {
  const a = norm360(ang);
  const names = ["à droite", "en haut à droite", "en haut", "en haut à gauche", "à gauche", "en bas à gauche", "en bas", "en bas à droite"];
  return names[Math.round(a / 45) % 8];
};
function markGeom(m) {
  let a0 = dirOf(m.v, m.a), a1 = dirOf(m.v, m.b);
  if (norm360(a1 - a0) > 180) { const t = a0; a0 = a1; a1 = t; }
  const span = norm360(a1 - a0);
  return { a0, a1, span, mid: a0 + span / 2 };
}
const sectorPath = (v, r, g) => {
  const p0 = P(v, g.a0, r), p1 = P(v, g.a1, r);
  return `M${fx(v[0])} ${fx(v[1])}L${fx(p0[0])} ${fx(p0[1])}A${r} ${r} 0 0 0 ${fx(p1[0])} ${fx(p1[1])}Z`;
};
const arcPath = (v, r, g) => {
  const p0 = P(v, g.a0, r), p1 = P(v, g.a1, r);
  return `M${fx(p0[0])} ${fx(p0[1])}A${r} ${r} 0 0 0 ${fx(p1[0])} ${fx(p1[1])}`;
};
// opts : tap = { id, sel, mark } pour les secteurs à toucher
function svgFig(spec, opts = {}) {
  const o = [];
  spec.lines.forEach(l => o.push(`<line x1="${fx(l[0][0])}" y1="${fx(l[0][1])}" x2="${fx(l[1][0])}" y2="${fx(l[1][1])}" class="ln"/>`));
  spec.segs.forEach(l => o.push(`<line x1="${fx(l[0][0])}" y1="${fx(l[0][1])}" x2="${fx(l[1][0])}" y2="${fx(l[1][1])}" class="ln"/>`));
  const marksSvg = [], labels = [], hits = [];
  spec.marks.forEach(m => {
    const g = markGeom(m), st = STY[m.style || "a"], r = m.r || 30;
    if (m.hit) {
      const sel = opts.tap && opts.tap.sel === m.id;
      hits.push(`<path class="hit${sel ? " sel" : ""}" d="${sectorPath(m.v, spec.hitR, g)}" data-tap="${opts.tap ? opts.tap.id : ""}" data-i="${m.id}" tabindex="0" role="button" aria-label="Angle ${posWords(g.mid)}" aria-pressed="${sel ? "true" : "false"}"/>`);
      return;
    }
    marksSvg.push(`<path d="${sectorPath(m.v, r + (st.n - 1) * 6, g)}" fill="${st.c}" fill-opacity=".30"/>`);
    for (let k = 0; k < st.n; k++) marksSvg.push(`<path d="${arcPath(m.v, r + k * 6, g)}" fill="none" stroke="${st.c}" stroke-width="3.2" stroke-linecap="round"/>`);
    if (m.label) {
      const half = g.span / 2, lr = m.lr || Math.min(98, Math.max(56, 26 / Math.sin(half * RAD)));
      const p = P(m.v, g.mid, lr);
      labels.push(`<text x="${fx(p[0])}" y="${fx(p[1])}" class="lbl${m.label === "?" ? " q" : ""}" text-anchor="middle" dominant-baseline="central">${m.label}</text>`);
    }

const mk = v => v === true ? "ok" : v === false ? "ko" : Array.isArray(v) ? (v.every(Boolean) ? "ok" : "ko") : "";
function wHTML(w, st, lock) {
  const m = st.marks[w.id], v = st.vals[w.id], dis = lock ? "disabled" : "";

      return `<div class="w ${mk(m)}"><p class="wl">${w.label}</p><div class="opts">${w.options.map((o, i) => `<button type="button" class="opt ${v === i ? "on" : ""}" data-choice="${w.id}" data-i="${i}" aria-pressed="${v === i}" ${o.color ? `style="--c:${o.color}"` : ""} ${dis}>${o.color ? '<span class="sw big"></span>' : ""}${o.t}</button>`).join("")}</div></div>`;

    }

    case "tf":
      return `<div class="w"><p class="wl">${w.label}</p>${w.statements.map((s, j) => {
        const t = v ? v[j] : undefined, mm = Array.isArray(m) ? m[j] : null;
        return `<div class="tfrow ${mm === true ? "ok" : mm === false ? "ko" : ""}"><p>${s.t}</p><div class="tfbtns"><button type="button" class="opt ${t === true ? "on" : ""}" data-tf="${w.id}" data-s="${j}" data-v="1" aria-pressed="${t === true}" ${dis}>Vrai</button><button type="button" class="opt ${t === false ? "on" : ""}" data-tf="${w.id}" data-s="${j}" data-v="0" aria-pressed="${t === false}" ${dis}>Faux</button></div></div>`;
      }).join("")}</div>`;
    case "order": {
      const o = v || (st.vals[w.id] = Array(w.items.length).fill(null));
      const used = new Set(o.filter(k => k !== null));
      const tok = k => `<div class="tok txt ${st.sel && st.sel.w === w.id && st.sel.k === k ? "sel" : ""}" data-w="${w.id}" data-k="${k}" role="button" tabindex="0" aria-label="étiquette : ${esc(w.items[k])}">${w.items[k]}</div>`;
      const pool = w.items.map((_, k) => k).filter(k => !used.has(k)).map(tok).join("");
      const slot = (k, i) => `<div class="oslot row ${Array.isArray(m) ? (m[i] ? "ok" : "ko") : ""}" data-w="${w.id}" data-s="${i}" tabindex="0" aria-label="emplacement ${i + 1}">${k === null ? `<i>${w.mode === "fig" ? "Dépose l'étiquette ici" : `Phrase n°${i + 1}`}</i>` : tok(k)}</div>`;

        ? `<div class="figrows">${o.map((k, i) => `<div class="figrow"><div class="figwrap sm">${w.figs[i]}</div><div class="figcap">Figure ${i + 1}</div>${slot(k, i)}</div>`).join("")}</div>`
        : `<div class="oslots col ${st.sel ? "ready" : ""}">${o.map(slot).join("")}</div>`;
      return `<div class="w ${mk(m)}"><p class="wl">${w.label}</p><div class="pool" data-pool="${w.id}">${pool || '<span class="note">Toutes les étiquettes sont placées.</span>'}</div>${body}</div>`;
    }

  return "";
}
const CHEERS = ["Bravo, patrouilleur !", "Mission réussie !", "Excellent travail !", "Quel flair !", "Cap sur la réussite !"];

// ---------------- actions ----------------
const clearMarks = st => { st.marks = {}; st.line = ""; st.warn = false; document.querySelectorAll(".w.ok,.w.ko,.oslot.ok,.oslot.ko,.tfrow.ok,.tfrow.ko").forEach(e => e.classList.remove("ok", "ko")); };

function check() {
  const ex = cur(), st = ex.st;
  if (st.status !== "open") return;
  if (!ex.widgets.every(w => answered(w, st.vals[w.id]))) {
    st.line = "Complète toutes les réponses avant de vérifier."; st.warn = true; render(); return;
  }
  st.tries++; st.warn = false;
  ex.widgets.forEach(w => { st.marks[w.id] = evalW(w, st.vals[w.id]); });
  const ok = ex.widgets.every(w => allOk(st.marks[w.id]));
  if (ok) {
    st.status = "ok"; st.stars = Math.max(1, 3 - (st.tries - 1) - (st.hints > 0 ? 1 : 0));
    st.msg = CHEERS[rnd(0, CHEERS.length - 1)]; st.line = ""; confetti(); finishIfLast();
  } else if (st.tries >= 3) {
    st.status = "failed"; st.stars = 0; st.line = "";
    st.msg = "Trois essais : c'est fini pour celui-ci. Lis la correction détaillée, puis passe au suivant."; finishIfLast();
  } else {
    st.msg = st.tries === 1 ? "Pas tout à fait. Regarde ce qui est marqué ✗ et réessaie !" : "Encore un essai. Un indice peut t'aider.";
    st.line = `Essai ${st.tries} sur 3.`;
  }
  render();
}
function finishIfLast() {
  const r = R[curA];
  if (r.i === r.ex.length - 1) {
    const total = sum(r.ex.map(e => e.st.stars));
    prog[curA] = { done: true, stars: total }; saveProg();
  }
}
function hint() {
  const st = cur().st;
  if (st.status !== "open" || st.hints >= 3) return;
  st.msg = cur().hints[st.hints]; st.hints++; render();
}
function next() {
  const r = R[curA];
  if (r.i < r.ex.length - 1) r.i++; else r.fin = true;
  render(); window.scrollTo(0, 0);
}
function replay() { R[curA] = { i: 0, ex: newExercises(curA), fin: false }; render(); window.scrollTo(0, 0); }

const tapVal = s => /^\d+$/.test(s) ? +s : s;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-choice],[data-tf],[data-step],[data-tap]");
  if (!t || !curA) return;
  const ex = cur(); if (!ex && !t.dataset.act) return;
  if (t.dataset.act) { ({ check, hint, next, replay })[t.dataset.act](); return; }
  const st = ex.st; if (st.status !== "open") return;
  if (t.dataset.choice) { st.vals[t.dataset.choice] = +t.dataset.i; clearMarks(st); render(); }
  else if (t.dataset.tap) { st.vals[t.dataset.tap] = tapVal(t.dataset.i); clearMarks(st); render(); }
  else if (t.dataset.tf) {
    const w = t.dataset.tf, arr = st.vals[w] || (st.vals[w] = Array(ex.widgets.find(x => x.id === w).statements.length).fill(null));
    arr[+t.dataset.s] = t.dataset.v === "1"; clearMarks(st); render();
  } else if (t.dataset.step) {
    const w = t.dataset.w, cfg = ex.widgets.find(x => x.id === w);
    const v = Math.min(cfg.max, Math.max(cfg.min, (st.vals[w] === undefined ? (cfg.min + cfg.max) / 2 : st.vals[w]) + (+t.dataset.step) * cfg.step));
    st.vals[w] = v; clearMarks(st); render();
  }
});
document.addEventListener("input", e => {
  const el = e.target; if (!curA || !el.dataset || !el.dataset.w || !cur()) return;
  const st = cur().st; if (st.status !== "open") return;
  if (el.type === "range") {
    st.vals[el.dataset.w] = +el.value;
    const cfg = cur().widgets.find(x => x.id === el.dataset.w);
    $("out_" + el.dataset.w).textContent = el.value + " " + cfg.unit;
  } else st.vals[el.dataset.w] = el.value;
  clearMarks(st);
});
document.addEventListener("keydown", e => {
  if (!curA || !cur()) return;
  if (e.key === "Enter" && e.target.matches && e.target.matches("input[type=text]")) { e.preventDefault(); check(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList) {
    if (e.target.classList.contains("tok")) { e.preventDefault(); tapTok(e.target.dataset.w, +e.target.dataset.k); }
    else if (e.target.classList.contains("oslot") && cur().st.sel) { e.preventDefault(); place(e.target.dataset.w, cur().st.sel.k, +e.target.dataset.s); }
    else if (e.target.classList.contains("hit")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  }
});

// ---------------- glisser-déposer des étiquettes (pointer events) + alternative « toucher puis toucher » ----------------
function place(wid, k, s) {
  const st = cur().st; if (st.status !== "open") return;
  const o = st.vals[wid], from = o.indexOf(k), occ = o[s];
  if (from === s) return;
  if (from >= 0) o[from] = occ;
  o[s] = k; st.sel = null; clearMarks(st); render();
}
function toPool(wid, k) {
  const st = cur().st, o = st.vals[wid], from = o.indexOf(k);
  if (from >= 0) o[from] = null;
  st.sel = null; clearMarks(st); render();
}
function tapTok(wid, k) {
  const st = cur().st; if (st.status !== "open") return;
  const o = st.vals[wid], at = o.indexOf(k);
  if (st.sel && st.sel.w === wid && st.sel.k !== k && at >= 0) { place(wid, st.sel.k, at); return; }
  st.sel = st.sel && st.sel.k === k && st.sel.w === wid ? null : { w: wid, k }; render();
}
document.addEventListener("click", e => {
  if (!curA || !cur()) return;
  const slot = e.target.closest(".oslot");
  if (slot && !e.target.closest(".tok") && cur().st.sel) place(slot.dataset.w, cur().st.sel.k, +slot.dataset.s);
  const pool = e.target.closest(".pool");
  if (pool && !e.target.closest(".tok") && cur().st.sel) toPool(pool.dataset.pool, cur().st.sel.k);
});
let drag = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".tok");
  if (!el || !curA || !cur() || cur().st.status !== "open" || e.button > 0) return;
  const r = el.getBoundingClientRect();
  drag = { w: el.dataset.w, k: +el.dataset.k, el, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, wd: r.width, ht: r.height, moved: false, ghost: null };
});
function moveGhost() {
  if (!drag || !drag.ghost) return;
  drag.ghost.style.left = (drag.px - drag.ox) + "px"; drag.ghost.style.top = (drag.py - drag.oy) + "px";
  document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
  const s = document.elementFromPoint(drag.px, drag.py)?.closest(".oslot");
  if (s && s.dataset.w === drag.w) s.classList.add("hover");
}
// défilement automatique quand le doigt approche du haut ou du bas de l'écran
function autoScroll() {
  if (!drag || drag.raf) return;
  const step = () => {
    if (!drag || !drag.moved) return;
    const edge = 90, h = innerHeight;
    const dy = drag.py > h - edge ? Math.ceil((drag.py - (h - edge)) / 5) : drag.py < edge ? -Math.ceil((edge - drag.py) / 5) : 0;
    if (dy) { scrollBy(0, dy); moveGhost(); }
    drag.raf = requestAnimationFrame(step);
  };
  drag.raf = requestAnimationFrame(step);
}
window.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 7) {
    drag.moved = true;
    const g = drag.el.cloneNode(true); g.classList.remove("sel"); g.classList.add("ghost"); g.style.width = drag.wd + "px"; g.style.minHeight = drag.ht + "px";
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("lifting");
  }
  if (drag.moved) {
    e.preventDefault();
    drag.px = e.clientX; drag.py = e.clientY; moveGhost(); autoScroll();
    document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".oslot");
    if (s && s.dataset.w === drag.w) s.classList.add("hover");
  }
}, { passive: false });
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null; if (d.raf) cancelAnimationFrame(d.raf);
  document.querySelectorAll(".oslot.hover").forEach(s => s.classList.remove("hover"));
  if (d.ghost) d.ghost.remove();
  if (d.moved) {
    if (cancelled) { render(); return; }
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".oslot");
    if (s && s.dataset.w === d.w) place(d.w, d.k, +s.dataset.s); else toPool(d.w, d.k);
  } else if (!cancelled) { tapTok(d.w, d.k); }
}
window.addEventListener("pointerup", e => endDrag(e, false));
window.addEventListener("pointercancel", e => endDrag(e, true));

// ---------------- confettis (aucun son) ----------------
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ffd23f", "#2f9e62", "#fff8e6", "#ff7a2f", "#58b8e6"];
  const ps = Array.from({ length: 90 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0]
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s / 1.6); ctx.restore(); });
    if (++t < 150) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

route();
