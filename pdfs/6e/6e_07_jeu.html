<script>
"use strict";
// ====================== LOGIQUE : générateurs d'exercices et figures (sans DOM) ======================
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const D2R = Math.PI / 180;
const norm = d => ((d % 360) + 360) % 360;
const f1 = x => Math.round(x * 10) / 10;

// Lettres de points : sans I, J, O (on les confond avec 1, 0) ni W
const LETTERS = "ABCDEFGHKLMNPQRSTUVXYZ".split("");
const takeLetters = n => shuffle(LETTERS).slice(0, n);

// Nom d'angle : trois lettres, le sommet toujours au milieu, chapeau dessiné en CSS
const ang = n => `<span class="ang" role="img" aria-label="angle ${n.split("").join(" ")}">${n}</span>`;
const key = n => [n[0], n[2]].sort().join("") + n[1];   // deux noms d'un même angle ont la même clé
const flip = n => n[2] + n[1] + n[0];
const orient = n => Math.random() < .5 ? n : flip(n);
const dr = (v, p) => `[${v}${p})`;                        // demi-droite d'origine v passant par p
const normText = s => String(s || "").toUpperCase().replace(/[\s\[\]()]/g, "");

// ---- constructeurs de zones de réponse ----
const W = {
  choice: (id, label, options, answerIdx) => ({ id, kind: "choice", label, options, answerIdx }),
  tf: (id, label, statements) => ({ id, kind: "tf", label, statements }),
  text: (id, label, accepted) => ({ id, kind: "text", label, accepted }),
  touch: (id, label, targets, answer, multi) => ({ id, kind: "touch", label, targets, answer, multi: !!multi }),
  slots: (id, label, o) => Object.assign({ id, kind: "slots", label, n: 1, hat: false, wide: false, prefix: "", slotLabels: null, sens: null }, o),
  bisect: (id, label, o) => Object.assign({ id, kind: "bisect", label }, o)
};
function answered(w, v) {
  switch (w.kind) {
    case "choice": return v !== undefined && v !== null;
    case "text": return normText(v).length > 0;
    case "touch": return Array.isArray(v) && v.length > 0;
    case "slots": return Array.isArray(v) && v.length === w.n && v.every(x => x !== null && x !== undefined);
    case "bisect": return typeof v === "number";
    case "tf": return Array.isArray(v) && v.length === w.statements.length && v.every(x => x === true || x === false);
  }
  return false;
}
function evalW(w, v) {
  switch (w.kind) {
    case "choice": return v === w.answerIdx;
    case "text": return w.accepted.map(normText).includes(normText(v));
    case "touch": return v.length === w.answer.length && w.answer.every(a => v.includes(a));
    case "slots": return !!w.ok(v.map(k => w.pool[k].v));
    case "bisect": return Math.abs(v - 50) <= w.tol;
    case "tf": return v.map((x, i) => x === w.statements[i].a);
  }
  return false;
}
const allOk = m => Array.isArray(m) ? m.every(Boolean) : m === true;
// Une bonne réponse pour chaque zone (utilisée par les tests et l'auto-vérification)
function correctVal(w) {
  switch (w.kind) {
    case "choice": return w.answerIdx;
    case "text": return w.accepted[0];
    case "touch": return w.answer.slice();
    case "bisect": return 50;
    case "tf": return w.statements.map(s => s.a);
    case "slots": { const used = new Set(); return w.sol.map(v => { const k = w.pool.findIndex((p, i) => p.v === v && !used.has(i)); used.add(k); return k; }); }
  }
}

// ====================== SCÈNES (angles et demi-droites) ======================
const ray = (id, name, dir, len, extra) => Object.assign({ id, name, dir: norm(dir), len, v: 0, style: "side" }, extra || {});
const scene = names => ({ verts: names.map(n => ({ name: n, x: 0, y: 0 })), rays: [], sectors: [], aria: "" });
function secDirs(sc, s) {
  const a = sc.rays.find(r => r.id === s.a), b = sc.rays.find(r => r.id === s.b);
  const diff = norm(b.dir - a.dir);
  return diff <= 180 ? [a.dir, a.dir + diff] : [b.dir, b.dir + norm(a.dir - b.dir)];
}
const secOpen = (sc, s) => { const [x, y] = secDirs(sc, s); return y - x; };

const INK = "#241c17", RED = "#cf3f2b", WOOD = "#6b4a2e", PAPER = "#f7f0de", GOLD = "#f0b94a";
const DEFS = `<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(240,185,74,.38)"/><line x1="0" y1="0" x2="0" y2="8" stroke="#a8730f" stroke-width="2.4"/></pattern></defs>`;
const arcD = (vx, vy, r, d1, d2) => {
  const sx = vx + r * Math.cos(d1 * D2R), sy = vy - r * Math.sin(d1 * D2R), ex = vx + r * Math.cos(d2 * D2R), ey = vy - r * Math.sin(d2 * D2R);
  return { arc: `M${f1(sx)} ${f1(sy)}A${r} ${r} 0 ${d2 - d1 > 180 ? 1 : 0} 0 ${f1(ex)} ${f1(ey)}`, wedge: `M${f1(vx)} ${f1(vy)}L${f1(sx)} ${f1(sy)}A${r} ${r} 0 ${d2 - d1 > 180 ? 1 : 0} 0 ${f1(ex)} ${f1(ey)}Z` };
};
// Codage : 1, 2, 3 traits, ou croix, posés sur l'arc au milieu de l'angle
function marksSVG(mark, vx, vy, r, mid) {
  if (!mark) return "";
  const at = (rr, d) => ({ x: vx + rr * Math.cos(d * D2R), y: vy - rr * Math.sin(d * D2R) });
  const st = `stroke="${INK}" stroke-width="2.8" stroke-linecap="round"`;
  if (mark === "x") {
    const c = at(r, mid);
    return `<path d="M${f1(c.x - 6)} ${f1(c.y - 6)}L${f1(c.x + 6)} ${f1(c.y + 6)}M${f1(c.x - 6)} ${f1(c.y + 6)}L${f1(c.x + 6)} ${f1(c.y - 6)}" ${st} fill="none"/>`;
  }
  const n = +mark, gap = 6.5 / r / D2R; let out = "";
  for (let i = 0; i < n; i++) {
    const d = mid + (i - (n - 1) / 2) * gap, a = at(r - 7, d), b = at(r + 7, d);
    out += `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" ${st}/>`;
  }

function actOf(a) { if (!S.acts[a]) S.acts[a] = { exs: newExercises(a), cur: 0 }; return S.acts[a]; }
const actDone = a => { const A = S.acts[a]; return !!A && A.exs.every(e => e.st.status !== "open"); };
const actStars = a => S.acts[a] ? S.acts[a].exs.reduce((s, e) => s + (e.st.status === "ok" ? calcStars(e) : 0), 0) : 0;
function route() { const m = /^#dossier-([1-7])$/.exec(location.hash); return m ? +m[1] : 0; }
function curEx() { const a = route(); if (!a || !S.acts[a]) return null; return S.acts[a].exs[S.acts[a].cur] || null; }
const getW = (ex, id) => ex.widgets.find(w => w.id === id);

// ====================== vues ======================
function viewHome() {
  const cards = [1, 2, 3, 4, 5, 6, 7].map(n => {
    const done = actDone(n), s = actStars(n);
    return `<a class="card" href="#dossier-${n}" aria-label="Atelier ${n} : ${NAMES(n)}${done ? ", validé" : ""}"><span class="cord"></span><span class="num">${n}</span>${ICONS[n]}<span class="nm">${NAMES(n)}</span>${done ? `<span class="stamp">Validé</span>` : ""}<span class="stars">${S.acts[n] ? (done ? `★ ${s} / 9` : "") : ""}</span></a>`;
  }).join("");
  const total = [1, 2, 3, 4, 5, 6, 7].filter(actDone).length;
  const msg = total === 0 ? "Bienvenue, apprenti ! Choisis un atelier. Je vérifie tout, hein." : total === 7 ? "Tous les ateliers sont validés. Le Maître est fier de toi !" : `Déjà ${total} atelier${total > 1 ? "s" : ""} validé${total > 1 ? "s" : ""}. Continue comme ça !`;
  return `<header class="banner">${BANNER}<h1 class="sign">Atelier du Maître Éventailliste<small>Chapitre 7 · Les angles</small></h1></header>
  <section class="board" aria-label="Les ateliers"><div class="cards">${cards}</div></section>
  <div class="desk"><div class="guide">${tsuru(total === 7 ? "h" : "n")}<p class="bubble" role="status">${msg}</p></div></div>
  <p class="legend">Les ateliers sont libres : choisis dans l'ordre que tu veux. Rien n'est enregistré sur l'appareil.</p>`;
}

function viewActivity(a) {
  const A = actOf(a), D = DOSSIERS[a];
  if (A.cur >= A.exs.length) return viewFinal(a);
  const ex = A.exs[A.cur], st = ex.st, locked = st.status !== "open";
  const dots = A.exs.map((e, i) => `<span class="dot ${i === A.cur ? "cur" : ""} ${e.st.status === "ok" ? "ok" : e.st.status === "failed" ? "failed" : ""}" title="Exercice ${i + 1}"></span>`).join("");
  const hintsShown = ex.hints.slice(0, st.hints).map((h, i) => `<li><b>Indice ${i + 1}</b> — ${h}</li>`).join("");
  const mood = st.status === "ok" ? "h" : (st.tries > 0 ? "w" : "n");
  const msg = st.msg || (st.tries === 0 ? "Lis bien la consigne, puis réponds à toutes les questions." : "");
  const last = A.cur === A.exs.length - 1;
  return `<div class="bar"><a class="back" href="#" aria-label="Retour à l'accueil">${HOME_ICO}</a><div class="ttl"><div class="n">Atelier ${a}</div><h1>${D.title}</h1></div>${CALC_NO}</div>
  <div class="dots" role="img" aria-label="Exercice ${A.cur + 1} sur ${A.exs.length}">${dots}<span class="t">Exercice ${A.cur + 1} / ${A.exs.length}</span></div>
  <section class="story"><h2>L'histoire</h2><p>${D.story}</p></section>
  <section class="card2" aria-live="off">
    <p class="cons">${ex.consigne}</p>
    <div class="figbox" id="fig">${ex.draw(st)}</div>
    <div class="answers">${ex.widgets.map(w => wHTML(w, ex)).join("")}</div>
    ${hintsShown ? `<ol class="solution" style="margin-top:12px;list-style:none;padding:12px 16px">${hintsShown}</ol>` : ""}
    <div class="guide2">${tsuru(mood, "tsuru")}<p class="bubble" role="status" aria-live="polite">${msg}${st.status === "ok" ? ` <b>${starTxt(calcStars(ex))}</b>` : ""}</p></div>
    ${st.status === "failed" ? `<div class="solution"><h3>Correction</h3>${ex.solution}</div>` : ""}
    ${st.status === "ok" ? `<div class="solution"><h3>À retenir</h3>${ex.solution}</div>` : ""}
    <div class="controls">
      <button class="btn" data-a="hint" ${locked || st.hints >= 3 ? "disabled" : ""}>Indice (${st.hints}/3)</button>
      <button class="btn primary" data-a="check" ${locked ? "disabled" : ""}>Vérifier</button>
      <button class="btn primary" data-a="next" ${locked ? "" : "disabled"}>${last ? "Terminer l'atelier" : "Exercice suivant"}</button>
    </div>
  </section>`;
}

function viewFinal(a) {
  const A = S.acts[a], s = actStars(a);
  return `<div class="bar"><a class="back" href="#" aria-label="Retour à l'accueil">${HOME_ICO}</a><div class="ttl"><div class="n">Atelier ${a}</div><h1>${DOSSIERS[a].title}</h1></div></div>
  <section class="final"><div class="stamp2">Validé</div><div class="big">${s} / 9 ★</div><p>${s >= 8 ? "Presque parfait : Tsuru n'a rien à redire !" : s >= 5 ? "Beau travail. Tu peux rejouer pour viser plus d'étoiles." : "Atelier terminé. Rejoue avec d'autres valeurs pour t'entraîner."}</p>
  <div style="display:flex;justify-content:center">${tsuru("h")}</div>
  <div class="controls"><button class="btn" data-a="replay">Rejouer avec d'autres valeurs</button></div></section>`;
}

// ---------- zones de réponse ----------
function wHTML(w, ex) {
  const st = ex.st, v = st.vals[w.id], m = st.marks[w.id], locked = st.status !== "open";
  let cls = "w", badge = "";
  if (st.miss && st.miss[w.id]) { cls += " miss"; badge = `<span class="bd ko">À compléter</span>`; }
  if (m !== undefined) { const ok = allOk(m); cls += ok ? " ok" : " ko"; badge = `<span class="bd ${ok ? "ok" : "ko"}">${ok ? "✓ Juste" : "✗ À revoir"}</span>`; }
  const plain = w.label.replace(/<[^>]+>/g, ""), head = `<span class="wl">${w.label}${badge}</span>`, dis = locked ? "disabled" : "";
  let body = "";
  if (w.kind === "choice") {
    body = `<div class="opts" role="group" aria-label="${plain}">` + w.options.map((o, i) => `<button class="opt ${v === i ? "on" : ""}" aria-pressed="${v === i}" data-a="opt" data-w="${w.id}" data-i="${i}" ${dis}>${o.t}</button>`).join("") + `</div>`;
  } else if (w.kind === "tf") {
    body = w.statements.map((s, i) => {
      const r = Array.isArray(m) ? m[i] : undefined;
      return `<div class="tfrow ${r === undefined ? "" : r ? "ok" : "ko"}"><p>${s.t}${r === undefined ? "" : r ? " <b>✓</b>" : " <b>✗</b>"}</p><div class="tfbtns"><button class="opt ${v && v[i] === true ? "on" : ""}" aria-pressed="${!!(v && v[i] === true)}" data-a="tf" data-w="${w.id}" data-i="${i}" data-b="1" ${dis}>Vrai</button><button class="opt ${v && v[i] === false ? "on" : ""}" aria-pressed="${!!(v && v[i] === false)}" data-a="tf" data-w="${w.id}" data-i="${i}" data-b="0" ${dis}>Faux</button></div></div>`;
    }).join("");
  } else if (w.kind === "text") {
    body = `<div class="field"><input type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="3" data-a="text" data-w="${w.id}" value="${(v || "").replace(/"/g, "")}" aria-label="${plain}" ${dis}></div>`;
  } else if (w.kind === "touch") {
    const names = (v || []).map(id => (w.targets.find(t => t.id === id) || {}).label).filter(Boolean);
    body = `<p class="selv">${names.length ? "Tu as touché : " + names.map(n => `<b>${n}</b>`).join(" ") : "Touche la figure ci-dessus."}</p>`;
  } else if (w.kind === "bisect") {
    const cur = v === undefined ? w.start : v;
    body = `<div class="sl"><button class="mini" data-a="bm" data-w="${w.id}" data-d="-1" aria-label="Déplacer vers le début" ${dis}>−</button><input type="range" min="0" max="100" step="1" value="${cur}" data-a="range" data-w="${w.id}" aria-label="Position de la demi-droite mobile" ${dis}><button class="mini" data-a="bm" data-w="${w.id}" data-d="1" aria-label="Déplacer vers la fin" ${dis}>+</button></div>`;
  } else if (w.kind === "slots") {
    const arr = v || Array(w.n).fill(null), used = new Set(arr.filter(x => x !== null));
    const sel = st.sel && st.sel.w === w.id ? st.sel.k : -1;
    const tok = (k, inSlot) => `<span class="tok ${sel === k ? "sel" : ""}" role="button" tabindex="0" data-w="${w.id}" data-k="${k}" aria-label="${w.pool[k].t.replace(/<[^>]+>/g, "")}${inSlot ? ", placée" : ""}">${w.pool[k].t}</span>`;
    const pool = w.pool.map((p, k) => used.has(k) ? "" : tok(k, false)).join("");
    const slots = arr.map((k, i) => `<div class="sc"><div class="oslot ${w.wide ? "wide" : ""} ${m !== undefined ? (allOk(m) ? "ok" : "ko") : ""}" role="button" tabindex="0" data-a="slot" data-w="${w.id}" data-i="${i}" aria-label="Emplacement ${i + 1}${k === null ? ", vide" : ""}">${k === null ? "<i>?</i>" : tok(k, true)}</div>${w.slotLabels ? `<span class="cap">${w.slotLabels[i]}</span>` : ""}</div>`).join("");
    body = `${w.sens ? `<div class="sens"><span>← ${w.sens[0]}</span><span>${w.sens[1]} →</span></div>` : ""}<div class="pool" data-pool="${w.id}" aria-label="Pastilles à placer">${pool}</div><div class="srow">${w.prefix ? `<span class="pre">${w.prefix}</span>` : ""}<div class="sgroup ${w.hat ? "hat" : ""}">${slots}</div></div>`;
  }
  return `<div class="${cls}">${head}${body}</div>`;
}

// ====================== rendu ======================
function render() {
  const y = window.scrollY, a = route();
  $app.innerHTML = a ? viewActivity(a) : viewHome();
  document.title = a ? `${DOSSIERS[a].title} · Atelier du Maître Éventailliste` : "Atelier du Maître Éventailliste · Les angles";
  window.scrollTo(0, y);
}
function refreshFig() { const ex = curEx(); if (ex) document.getElementById("fig").innerHTML = ex.draw(ex.st); }
function touched(ex, id) { delete ex.st.marks[id]; if (ex.st.miss) delete ex.st.miss[id]; }

// ====================== actions ======================
function setVal(ex, id, val, redraw) { ex.st.vals[id] = val; touched(ex, id); if (redraw !== false) render(); }
function placeTok(ex, w, k, i) {
  const arr = (ex.st.vals[w.id] || Array(w.n).fill(null)).slice();
  const at = arr.indexOf(k); if (at >= 0) arr[at] = null;
  arr[i] = k; ex.st.sel = null; setVal(ex, w.id, arr);
}
function unplaceTok(ex, w, k) { const arr = (ex.st.vals[w.id] || []).slice(); const at = arr.indexOf(k); if (at >= 0) arr[at] = null; ex.st.sel = null; setVal(ex, w.id, arr); }
function tapTok(ex, w, k) {
  const arr = ex.st.vals[w.id] || [];
  if (arr.includes(k)) return unplaceTok(ex, w, k);
  const s = ex.st.sel; ex.st.sel = s && s.w === w.id && s.k === k ? null : { w: w.id, k }; render();
}
function tapSlot(ex, w, i) {
  const arr = ex.st.vals[w.id] || Array(w.n).fill(null), s = ex.st.sel;
  if (s && s.w === w.id) return placeTok(ex, w, s.k, i);
  if (arr[i] !== null && arr[i] !== undefined) unplaceTok(ex, w, arr[i]);
}
function doCheck() {
  const ex = curEx(); if (!ex || ex.st.status !== "open") return;
  const st = ex.st;
  const missing = ex.widgets.filter(w => !answered(w, st.vals[w.id]));
  if (missing.length) {
    st.miss = {}; missing.forEach(w => { st.miss[w.id] = true; });
    st.msg = "Il manque des réponses : regarde les cadres « À compléter ». Puis clique encore sur Vérifier.";
    render();
    const first = document.querySelector(".w.miss"); if (first && first.scrollIntoView) first.scrollIntoView({ block: "center" });
    return;
  }
  st.miss = {};
  st.tries++;
  ex.widgets.forEach(w => { st.marks[w.id] = evalW(w, st.vals[w.id]); });
  if (ex.widgets.every(w => allOk(st.marks[w.id]))) { st.status = "ok"; st.sel = null; st.stars = calcStars(ex); st.msg = CHEERS[rnd(0, CHEERS.length - 1)] + " Tampon « Validé » !"; render(); confetti(); return; }
  if (st.tries >= 3) { st.status = "failed"; st.sel = null; st.msg = "Trois essais : voici la correction. Lis-la bien, puis passe à la suite."; }
  else { const r = 3 - st.tries; st.msg = `Pas encore. Regarde les ✗ « À revoir ». Il te reste ${r} essai${r > 1 ? "s" : ""}.`; }
  render();
}
function doHint() { const ex = curEx(); if (!ex || ex.st.status !== "open" || ex.st.hints >= 3) return; ex.st.hints++; render(); }
function doNext() { const a = route(), A = S.acts[a], ex = curEx(); if (!ex || ex.st.status === "open") return; A.cur++; window.scrollTo(0, 0); render(); }

// ---------- événements ----------
$app.addEventListener("click", e => {
  const hot = e.target.closest("[data-hot]");
  if (hot) { touchHot(hot.dataset.hot); return; }
  if (e.target.closest(".tok")) return;     // géré par les pointer events
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, ex = curEx();
  if (a === "check") return doCheck();
  if (a === "hint") return doHint();
  if (a === "next") return doNext();
  if (a === "replay") { S.acts[route()] = null; actOf(route()); render(); return; }
  if (!ex || ex.st.status !== "open") return;
  const w = getW(ex, b.dataset.w);
  if (a === "opt") setVal(ex, w.id, +b.dataset.i);
  else if (a === "tf") { const arr = (ex.st.vals[w.id] || Array(w.statements.length).fill(null)).slice(); arr[+b.dataset.i] = b.dataset.b === "1"; setVal(ex, w.id, arr); }
  else if (a === "slot") tapSlot(ex, w, +b.dataset.i);
  else if (a === "bm") { const cur = ex.st.vals[w.id] === undefined ? w.start : ex.st.vals[w.id]; setVal(ex, w.id, Math.max(0, Math.min(100, cur + +b.dataset.d))); }
});
function touchHot(id) {
  const ex = curEx(); if (!ex || ex.st.status !== "open") return;
  const w = ex.widgets.find(x => x.kind === "touch"); if (!w) return;
  let cur = (ex.st.vals[w.id] || []).slice();
  if (w.multi) cur = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id); else cur = [id];
  setVal(ex, w.id, cur);
}
$app.addEventListener("input", e => {
  const t = e.target, ex = curEx(); if (!ex || !t.dataset.a) return;
  const w = getW(ex, t.dataset.w);
  if (t.dataset.a === "text") { t.value = t.value.toUpperCase(); ex.st.vals[w.id] = t.value; touched(ex, w.id); }
  else if (t.dataset.a === "range") { ex.st.vals[w.id] = +t.value; touched(ex, w.id); refreshFig(); }
});
$app.addEventListener("change", e => { if (e.target.dataset.a === "range") render(); });
$app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.a === "text") { e.preventDefault(); doCheck(); return; }
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target, ex = curEx(); if (!ex || ex.st.status !== "open") return;
  if (el.matches("[data-hot]")) { e.preventDefault(); touchHot(el.dataset.hot); }
  else if (el.matches(".tok")) { e.preventDefault(); tapTok(ex, getW(ex, el.dataset.w), +el.dataset.k); }
  else if (el.matches(".oslot")) { e.preventDefault(); tapSlot(ex, getW(ex, el.dataset.w), +el.dataset.i); }
});

// ---------- glisser-déposer (pointer events) + « toucher puis toucher » ----------
let drag = null;
$app.addEventListener("pointerdown", e => {
  document.querySelectorAll(".tok.ghost").forEach(n => n.remove()); drag = null;
  const t = e.target.closest(".tok"), ex = curEx(); if (!t || !ex || ex.st.status !== "open") return;
  drag = { el: t, w: t.dataset.w, k: +t.dataset.k, x: e.clientX, y: e.clientY, moved: false, ghost: null, id: e.pointerId };
  try { t.setPointerCapture(e.pointerId); } catch (_) {}
});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true; const g = drag.el.cloneNode(true); g.classList.add("ghost"); document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("lifting");
  }
  if (drag.moved) {
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.ghost.offsetWidth / 2) + "px"; drag.ghost.style.top = (e.clientY - drag.ghost.offsetHeight / 2) + "px";
    document.querySelectorAll(".oslot.hover").forEach(n => n.classList.remove("hover"));
    const s = slotAt(e.clientX, e.clientY, drag.w); if (s) s.classList.add("hover");
  }
}, { passive: false });
function slotAt(x, y, wid) {
  const direct = document.elementFromPoint(x, y), s = direct && direct.closest ? direct.closest(".oslot") : null;
  if (s && s.dataset.w === wid) return s;
  let best = null, bd = 56;     // tolérance pour les gros doigts
  document.querySelectorAll(`.oslot[data-w="${wid}"]`).forEach(n => { const r = n.getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)); if (d < bd) { bd = d; best = n; } });
  return best;
}
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll(".oslot.hover").forEach(n => n.classList.remove("hover"));
  const ex = curEx(); if (!ex || cancel) { render(); return; }
  const w = getW(ex, d.w);
  if (!d.moved) return tapTok(ex, w, d.k);
  const s = slotAt(e.clientX, e.clientY, d.w);
  if (s) placeTok(ex, w, d.k, +s.dataset.i);
  else { const el = document.elementFromPoint(e.clientX, e.clientY); if (el && el.closest(".pool")) unplaceTok(ex, w, d.k); else render(); }
}
window.addEventListener("pointerup", e => endDrag(e, false));
window.addEventListener("pointercancel", e => endDrag(e, true));

// ---------- confettis (aucun son) ----------
function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("fx"), g = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#cf3f2b", "#f0b94a", "#9fd1c4", "#f7f0de"], P = Array.from({ length: 70 }, () => ({ x: innerWidth / 2 + rnd(-60, 60), y: innerHeight * .6, vx: rnd(-70, 70) / 10, vy: -rnd(40, 120) / 10, s: rnd(5, 10), c: pick(cols), r: rnd(0, 6) }));
  let n = 0; (function f() { g.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); }); if (++n < 80) requestAnimationFrame(f); else g.clearRect(0, 0, c.width, c.height); })();
}

window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
render();

</script></body></html>
